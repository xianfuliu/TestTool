name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送以v开头的标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许创建Release
      packages: write  # 允许上传文件
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        # 安装Windows构建依赖
        pip install pywin32
        pip install pypiwin32
        
    - name: Extract version from tag
      id: get_version
      run: |
        # 从标签名提取版本号（去掉v前缀）
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
    - name: Build application
      env:
        APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        python build.py --version "${{ steps.get_version.outputs.VERSION }}"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestTool-${{ steps.get_version.outputs.VERSION }}
        path: dist/TestTool.exe
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/TestTool.exe
        asset_name: TestTool-${{ steps.get_version.outputs.VERSION }}.exe
        asset_content_type: application/octet-stream