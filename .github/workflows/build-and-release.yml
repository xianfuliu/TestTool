name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送以v开头的标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许创建Release
      packages: write  # 允许上传文件
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Extract version from tag
      id: get_version
      run: |
        # 检查是否是从标签触发
        if ($env:GITHUB_REF -like "refs/tags/v*") {
          $VERSION = $env:GITHUB_REF -replace "refs/tags/v", ""
          Write-Output "从标签提取版本号: $VERSION"
        } else {
          Write-Output "警告：不是从标签触发，使用默认版本号"
          $VERSION = "1.0.0"
        }
        
        # 验证版本号格式
        if ([string]::IsNullOrEmpty($VERSION)) {
          Write-Output "错误：版本号为空，使用默认值"
          $VERSION = "1.0.0"
        }
        
        Write-Output "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Output "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        
    - name: Build application
      env:
        APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        python build.py --version "${{ steps.get_version.outputs.VERSION }}"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestTool-${{ steps.get_version.outputs.VERSION }}
        path: dist/TestTool.exe
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/TestTool.exe
        asset_name: TestTool-${{ steps.get_version.outputs.VERSION }}.exe
        asset_content_type: application/octet-stream